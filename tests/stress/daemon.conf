# Mode: daemon
# Paths: /stress/subinterp /stress/global /stress/lazy
#
# One daemon process group with many threads, recycled after a fixed
# number of requests so that process start is exercised over and over.
# Three mounts of the same application: one preloaded into a named sub
# interpreter at process start, one in the main interpreter, and one
# whose sub interpreter is created on the first request to reach it.
#
# STRESS_DIR, STRESS_THREADS and STRESS_MAXIMUM_REQUESTS are defined by
# scripts/run-stress.sh.

WSGIDaemonProcess stress threads=${STRESS_THREADS} \
    maximum-requests=${STRESS_MAXIMUM_REQUESTS}

WSGIScriptAlias /stress/subinterp ${STRESS_DIR}/shared_state.py \
    process-group=stress application-group=stress
WSGIScriptAlias /stress/global ${STRESS_DIR}/shared_state.py \
    process-group=stress application-group=%{GLOBAL}
WSGIScriptAlias /stress/lazy ${STRESS_DIR}/shared_state.py \
    process-group=stress

<Directory ${STRESS_DIR}>
    Require all granted
</Directory>
