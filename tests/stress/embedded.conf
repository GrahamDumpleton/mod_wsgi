# Mode: embedded
# Paths: /stress/embedded /stress/embedded-subinterp
#
# The application runs inside the Apache child processes, which are
# recycled after a fixed number of connections so that child start is
# exercised over and over. Two mounts: one in the application group
# derived from the URL, created on the first request, and one in a
# named sub interpreter.
#
# STRESS_DIR and STRESS_MAXIMUM_REQUESTS are defined by
# scripts/run-stress.sh.

MaxConnectionsPerChild ${STRESS_MAXIMUM_REQUESTS}

WSGIScriptAlias /stress/embedded ${STRESS_DIR}/shared_state.py
WSGIScriptAlias /stress/embedded-subinterp ${STRESS_DIR}/shared_state.py \
    application-group=stress

<Directory ${STRESS_DIR}>
    Require all granted
</Directory>
